# Config nginx para servir el HLS de EN .REC desde el datacenter.
# Instalar como server block (ej: /etc/nginx/sites-available/media.enrec.com.ar)
# y emitir cert con: certbot --nginx -d media.enrec.com.ar
# Los archivos los genera backend/scripts/transcode-hls.sh en /var/www/hls/<slug>/

server {
    listen 80;
    server_name media.enrec.com.ar;
    # certbot agrega el bloque 443 + redirect al emitir el certificado

    root /var/www;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        image/jpeg jpg;
    }

    location /hls/ {
        add_header Access-Control-Allow-Origin * always;

        # Playlists: sin cache (permiten republicar/re-transcodear)
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-cache" always;
        }

        # Segmentos: inmutables, cache larga
        location ~ \.ts$ {
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
